name: belajar_ceria
description: A simple educational quiz game for elementary students.
publish_to: 'none'
version: 0.0.1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  dio: ^5.9.0
  shared_preferences: ^2.5.3
  audioplayers: ^6.5.1
  google_fonts: ^8.2.1

dev_dependencies:
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true

  assets:
    # ---------- SUARA ----------
    - assets/BENAR.mp3
    - assets/wrong.wav

    # ---------- SPLASH SCREEN ----------
    # Nama file HARUS persis begini (huruf S besar di "Screen"),
    # karena splash_page.dart memanggil 'assets/Splash Screen.jpeg'.
    - assets/Splash Screen.jpeg
    - assets/Matahari.png
    - assets/AWAN 1.png
    - assets/AWAN 2.png
    - assets/AWAN 3.png

    # ---------- IKON KARTU KELAS (dashboard) ----------
    - assets/Kelas 1.png
    - assets/Kelas 2.png
    - assets/Kelas 3.png
    - assets/Kelas 4.png
    - assets/Kelas 5.png
    - assets/Kelas 6.png

    # ---------- POHON (latar belakang) ----------
    - assets/Gambar pohon 1.png
    - assets/Gambar pohon 2.png
    - assets/Gambar pohon 3.png

    # ---------- ILUSTRASI ANAK & GURU ----------
    - assets/Gambar anak anak sd.png
    - assets/Gambar anak sd.png
    - assets/Gambar anak sd lagi.png
    - assets/anak sd angkat tangan.png
    - assets/anak sd tolong menolong.png
    - assets/Gambar guru l.png
    - assets/Gambar guru p.png
    - assets/Naik bus.png
    - assets/Anak Sd Cewek.png
    - assets/Anak Sd Cowok.png